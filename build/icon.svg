<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#6d8bff" />
  <defs>
    <clipPath id="nemoBody">
      <ellipse cx="52" cy="52" rx="24" ry="16" />
    </clipPath>
  </defs>
  <!-- tail -->
  <path d="M32 52 L13 36 L21 52 L13 68 Z" fill="#ffffff" />
  <!-- fins -->
  <polygon points="45,38 61,25 64,40" fill="#ffffff" />
  <polygon points="50,68 62,68 55,78" fill="#ffffff" />
  <!-- body -->
  <ellipse cx="52" cy="52" rx="24" ry="16" fill="#ffffff" />
  <!-- stripes (same colour as background = reads as gaps) -->
  <g clip-path="url(#nemoBody)">
    <rect x="42" y="34" width="7" height="36" fill="#6d8bff" />
    <rect x="56" y="34" width="5.5" height="36" fill="#6d8bff" />
  </g>
  <!-- eye -->
  <circle cx="66" cy="49" r="4.2" fill="#1d1f27" />
  <circle cx="67.5" cy="47.5" r="1.5" fill="#ffffff" />
</svg>
