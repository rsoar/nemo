appId: com.rsoar.nemo
productName: nemo
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# Native modules can't be loaded from inside the asar archive.
asarUnpack:
  - "**/*.node"
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  executableName: nemo
  maintainer: rsoar_dev <rsoar_dev@outlook.com>
  artifactName: ${productName}-${version}.${ext}
