<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="glassClip">
      <circle cx="512" cy="512" r="470" />
    </clipPath>
    <!-- soft glossy film, brighter at the top -->
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- top-left specular highlight -->
    <radialGradient id="glassSpec" cx="34%" cy="30%" r="34%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- rim light around the edge -->
    <radialGradient id="glassRim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#dbe8ff" stop-opacity="0" />
      <stop offset="95%" stop-color="#dbe8ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#dbe8ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#glassClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glassSheen)" />
    <circle cx="512" cy="512" r="470" fill="url(#glassRim)" />
    <ellipse cx="360" cy="320" rx="240" ry="185" fill="url(#glassSpec)" />
    <!-- crisp little glint -->
    <ellipse cx="338" cy="292" rx="66" ry="34" fill="#ffffff" fill-opacity="0.5"
      transform="rotate(-28 338 292)" />
    <!-- faint lower-right bounce light -->
    <ellipse cx="660" cy="700" rx="150" ry="90" fill="#ffffff" fill-opacity="0.05"
      transform="rotate(-20 660 700)" />
  </g>
</svg>
